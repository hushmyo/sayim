<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sayım">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sayım</title>
<style>
:root{--bg:#f3f5f8;--fg:#1b2430;--card:#fff;--ln:#d6dce5;--ac:#1f4e79;--ok:#1b7f3b;--wr:#b45309;--er:#b42318;--mu:#6b7686}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--fg:#e8edf4;--card:#1a222d;--ln:#2d3847;--ac:#6aa7e0;--ok:#4cc27a;--wr:#f0a04b;--er:#ff7b72;--mu:#93a0b3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}
header h1{font-size:18px;margin:0;flex:1}header .st{font-size:12px;opacity:.9}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font-size:12px}nav button.on{color:var(--ac);font-weight:700}
main{padding:12px;max-width:760px;margin:auto}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea,button.b{width:100%;font:inherit;padding:11px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--fg)}
button.b{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:8px}button.b.g{background:var(--bg);color:var(--fg);border:1px solid var(--ln)}
.row{display:flex;gap:8px}.row>*{flex:1}
.dur{font-weight:700;padding:8px 10px;border-radius:9px;margin:8px 0;background:var(--bg)}
.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;font-size:14px}.kv b{color:var(--mu);font-weight:500}
.cnt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}.cnt div{background:var(--bg);border-radius:8px;padding:6px 0;font-size:11px;color:var(--mu)}.cnt b{display:block;font-size:18px;color:var(--fg)}
.it{border-top:1px solid var(--ln);padding:8px 0;font-size:14px}.it:first-child{border-top:0}.it small{color:var(--mu)}
.x{float:right;border:0;background:none;color:var(--er);font-size:18px}
.msg{font-size:13px;color:var(--mu)}details summary{cursor:pointer;color:var(--ac);padding:6px 0}
img.th,video.th{max-width:100%;max-height:180px;border-radius:8px;margin:4px 0}
</style></head><body>
<header><h1>Sayım</h1><span class="st" id="durum">—</span></header>
<main>
<section id="s-say" class="on">
 <div class="card">
  <label>Sayım yeri / kişi</label>
  <input id="yer" list="yerler" placeholder="Yer veya kişi seçin / yazın" autocomplete="off"><datalist id="yerler"></datalist>
  <label>SİCİL NO / BARKOD (okutun)</label>
  <input id="sicil" autocomplete="off" autocapitalize="off" placeholder="Okutun veya yazın, Enter">
  <div id="kont" class="dur">—</div>
  <div id="bilgi" class="kv"></div>
  <details><summary>Sicilsiz / not ekle</summary>
   <label>Malzeme adı (elle – sicilsiz)</label><input id="ad" autocomplete="off">
   <label>Not / fazla açıklama</label><select id="not"></select>
   <label>Ek açıklama (isteğe bağlı)</label><input id="not2" autocomplete="off">
  </details>
  <div class="row"><button class="b" id="ekle">Kaydet (Enter)</button><button class="b g" id="temizle">Temizle</button></div>
  <div class="msg" id="mesaj"></div>
 </div>
 <div class="card"><b id="ozbas">Yer özeti</b><div class="cnt" id="oz"></div>
  <details><summary>Kalan ürünler (bu yerde okutulmayan)</summary><div id="kalan"></div></details></div>
 <div class="card"><b>Son kayıtlar</b><div id="son"></div></div>
</section>
<section id="s-liste"><div class="card"><b>Tüm kayıtlar</b> <span class="msg" id="lsay"></span><input id="ara" placeholder="Ara…" style="margin-top:8px"><div id="tum"></div></div></section>
<section id="s-gon">
 <div class="card"><b>Excel'e gönder</b>
  <p class="msg" id="bek">Bekleyen kayıt: 0</p>
  <button class="b" id="gonder">OneDrive'a gönder</button>
  <button class="b g" id="paylas">Dosya olarak paylaş / indir (girişsiz yol)</button>
  <div class="msg" id="gmsg"></div></div>
 <div class="card"><b>Listeler (Excel'den)</b>
  <p class="msg" id="lbilgi"></p>
  <button class="b" id="cek">OneDrive'dan listeleri al</button>
  <label>veya dosyadan yükle (yerler.txt, notlar.txt, beklenen.txt – birlikte seçilebilir)</label>
  <input type="file" id="dosya" accept=".txt" multiple></div>
</section>
<section id="s-ayar">
 <div class="card"><b>Ayarlar</b>
  <label>Cihaz adı (dosya adında kullanılır)</label><input id="cihaz" placeholder="ör. iphone-hasan">
  <label>Microsoft uygulama (Client) kimliği – boşsa girişsiz mod</label><input id="cid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
  <label>OneDrive Mobil klasörü</label><input id="kok" value="Sayım İşlemleri/Mobil">
  <button class="b" id="kaydet">Kaydet</button>
  <button class="b g" id="giris">Microsoft ile giriş yap</button>
  <p class="msg" id="amsg"></p>
  <p class="msg">Yönlendirme adresi (Entra'da SPA olarak): <b id="ru"></b></p></div>
 <div class="card"><b>Veri</b><button class="b g" id="sil">Gönderilmiş kayıtları telefondan sil</button></div>
</section>
</main>
<nav><button data-s="s-say" class="on">Sayım</button><button data-s="s-liste">Liste</button><button data-s="s-gon">Gönder</button><button data-s="s-ayar">Ayarlar</button></nav>
<script>
'use strict';
const $=id=>document.getElementById(id);
const VER='1';
// ---------- depolama ----------
const idb=new Promise((res,rej)=>{const r=indexedDB.open('sayim',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{const d=await idb;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})};
const kvSet=async(k,v)=>{const d=await idb;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r()})};
const kvDel=async k=>{const d=await idb;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>r()})};
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let kayit=ls('kayit',[]);   // {id,yer,sicil,ad,not,t:'yyyy-mm-dd hh:mm:ss',g:0/1,medya:[{ad,tur}]}
let ayar=ls('ayar',{cihaz:'telefon',cid:'',kok:'Sayım İşlemleri/Mobil'});
let yerler=[],notlar=[],bek=[],anah=new Map(),barm=new Map();
// ---------- yardımcı ----------
const p2=n=>String(n).padStart(2,'0');
const zaman=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').trim().toLocaleUpperCase('tr');
// Excel BarkodDuzelt/Anahtar mantığı: içinde '-' varsa Bar_Kod (olduğu gibi), yoksa yalnız rakamlar
function duzelt(k){k=String(k||'').trim();if(!k)return '';if(k.includes('-'))return k.replace(/\s+/g,'');return k.replace(/[^0-9]/g,'')}
function ayr(l){return l.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(x=>x.trim()!=='')}
function indeksle(){anah=new Map();barm=new Map();for(const r of bek){anah.set(r[0],r);if(r[2]){const a=barm.get(r[2])||[];a.push(r);barm.set(r[2],a)}}}
// ---------- durum (Excel Durum formülüyle aynı sıra) ----------
function durum(k,yer,onceki){
  const s=duzelt(k.sicil);
  if(!s&&!k.ad)return['','',null];
  if(!yer)return['YER SEÇİN','er',null];
  if(!s)return['FAZLA – sicilsiz (elle)','wr',null];
  if(onceki.has(s))return['MÜKERRER','wr',anah.get(s)||null];
  const r=anah.get(s);
  if(!r){if(barm.has(s))return['BARKOD (sicil değil)','wr',barm.get(s)[0]];
    return bek.length?['FAZLA – raporda yok','er',null]:['(liste yok)','wr',null]}
  const y=norm(yer);
  if(norm(r[9])===y||norm(r[11])===y)return['YERİNDE','ok',r];
  return['FAZLA – başka yerde kayıtlı','wr',r];
}
function hesapla(liste){const gor=new Set(),out=[];for(const k of liste){const d=durum(k,k.yer,gor);const s=duzelt(k.sicil);if(s)gor.add(s);out.push(d)}return out}
// ---------- arayüz ----------
function bilgiKart(r){if(!r){$('bilgi').innerHTML='';return}
  const a=[['Açıklama',r[3]],['Cinsi',r[4]],['Marka/Model',(r[6]||'')+' '+(r[7]||'')],['Ek özellik',r[5]],['Kayıtlı yer',r[9]],['Zimmet',r[11]],['Fiş / tarih',(r[12]||'')+' '+(r[13]||'')],['Sicil',r[1]],['Bar_Kod',r[2]]];
  $('bilgi').innerHTML=a.filter(x=>x[1]&&String(x[1]).trim()).map(x=>'<b>'+x[0]+'</b><span>'+esc(x[1])+'</span>').join('')}
function onizle(){const k=$('sicil').value;const yer=$('yer').value.trim();
  const gor=new Set(kayit.filter(x=>duzelt(x.sicil)).map(x=>duzelt(x.sicil)));
  const d=durum({sicil:k,ad:$('ad').value},yer,gor);
  $('kont').textContent=d[0]||'—';$('kont').className='dur '+d[1];bilgiKart(d[2]);return d}
function ozet(){const yer=$('yer').value.trim();const y=norm(yer);
  $('ozbas').textContent='Yer özeti'+(yer?': '+yer:'');
  if(!yer){$('oz').innerHTML='';$('kalan').innerHTML='';return}
  const ds=hesapla(kayit),n={ok:0,faz:0,muk:0,okut:0};const okunan=new Set();
  kayit.forEach((k,i)=>{if(norm(k.yer)!==y)return;n.okut++;const t=ds[i][0];if(t==='YERİNDE'){n.ok++;okunan.add(duzelt(k.sicil))}else if(t==='MÜKERRER')n.muk++;else if(t)n.faz++});
  const kay=bek.filter(r=>norm(r[9])===y||norm(r[11])===y);
  const kalan=kay.filter(r=>!okunan.has(r[0]));
  $('oz').innerHTML=[['Kayıtlı',kay.length],['Okutulan',n.okut],['Yerinde',n.ok],['Noksan',kalan.length],['Fazla',n.faz],['Mükerrer',n.muk]].map(x=>'<div>'+x[0]+'<b>'+x[1]+'</b></div>').join('');
  $('kalan').innerHTML=kalan.slice(0,300).map(r=>'<div class="it">'+esc(r[3])+' <small>'+esc(r[1])+' · '+esc(r[6]||'')+' '+esc(r[7]||'')+'</small></div>').join('')||'<div class="msg">Kalan ürün yok.</div>'}
function kayitSatir(k,d,ms){return '<div class="it"><button class="x" data-sil="'+k.id+'">×</button><b>'+esc(k.sicil||k.ad)+'</b> <span class="'+d[1]+'">'+esc(d[0])+'</span><br><small>'+esc(k.yer)+' · '+esc(k.t)+(k.not?' · '+esc(k.not):'')+(k.g?' · ✓gönderildi':'')+'</small>'+(ms?medyaHtml(k):'')+'</div>'}
function medyaHtml(k){return '<details data-m="'+k.id+'"><summary>Resim / video ('+(k.medya?k.medya.length:0)+')</summary><div class="mm" id="m'+k.id+'"></div>'+
 '<input type="file" accept="image/*,video/*" capture data-ekle="'+k.id+'"></details>'}
function liste(){const ds=hesapla(kayit);
  $('son').innerHTML=kayit.map((k,i)=>[k,ds[i]]).slice(-8).reverse().map(x=>kayitSatir(x[0],x[1],true)).join('')||'<div class="msg">Henüz kayıt yok.</div>';
  const q=norm($('ara').value);
  const t=kayit.map((k,i)=>[k,ds[i]]).filter(x=>!q||norm([x[0].sicil,x[0].ad,x[0].yer,x[0].not,x[1][0]].join(' ')).includes(q)).reverse();
  $('lsay').textContent='('+kayit.length+')';$('tum').innerHTML=t.slice(0,400).map(x=>kayitSatir(x[0],x[1],false)).join('');
  const b=kayit.filter(k=>!k.g).length;$('bek').textContent='Bekleyen kayıt: '+b;ozet();}
function yenile(){onizle();liste()}
function listeBilgi(){$('lbilgi').textContent='Yer: '+yerler.length+' · Not: '+notlar.length+' · Beklenen kayıt: '+bek.length+(bek.length?'':' (liste yok: Excel\'den beklenen.txt alın)');
  $('yerler').innerHTML=yerler.map(y=>'<option value="'+esc(y)+'">').join('');
  $('not').innerHTML='<option value=""></option>'+notlar.map(n=>'<option>'+esc(n)+'</option>').join('')}
// ---------- kayıt ekleme ----------
let sayac=0;
async function ekle(){const yer=$('yer').value.trim();const sicil=$('sicil').value.trim();const ad=$('ad').value.trim();
  if(!sicil&&!ad){$('sicil').focus();return}
  if(!yer){$('mesaj').textContent='Önce sayım yerini seçin.';$('yer').focus();return}
  const nt=[$('not').value,$('not2').value.trim()].filter(Boolean).join(' – ');
  const k={id:Date.now()+'-'+(sayac++),yer,sicil:duzelt(sicil)||sicil,ad,not:nt,t:zaman(),g:0,medya:[]};
  const gor=new Set(kayit.map(x=>duzelt(x.sicil)).filter(Boolean));const d=durum(k,yer,gor);
  kayit.push(k);lsSet('kayit',kayit);lsSet('yer',yer);
  $('mesaj').innerHTML='<span class="'+d[1]+'">'+esc(k.sicil||k.ad)+' – '+esc(d[0])+'</span>';
  if(navigator.vibrate)navigator.vibrate(d[1]==='ok'?30:[60,40,60]);
  $('sicil').value='';$('ad').value='';$('not').value='';$('not2').value='';
  liste();onizle();$('sicil').focus();otoGonder()}
$('ekle').onclick=ekle;
$('sicil').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ekle()}});
$('sicil').addEventListener('input',onizle);$('ad').addEventListener('input',onizle);
$('yer').addEventListener('change',()=>{lsSet('yer',$('yer').value);yenile();$('sicil').focus()});
$('temizle').onclick=()=>{$('sicil').value='';$('ad').value='';$('not').value='';$('not2').value='';onizle();$('sicil').focus()};
$('ara').oninput=liste;
document.addEventListener('click',async e=>{const s=e.target.dataset&&e.target.dataset.sil;
  if(s&&confirm('Bu kayıt silinsin mi?')){const k=kayit.find(x=>x.id===s);if(k&&k.g)alert('Bu kayıt Excel\'e gönderilmişti; Excel\'den ayrıca silmeniz gerekir.');kayit=kayit.filter(x=>x.id!==s);lsSet('kayit',kayit);liste()}});
document.addEventListener('toggle',async e=>{const id=e.target.dataset&&e.target.dataset.m;if(id&&e.target.open)medyaGoster(id)},true);
// ---------- medya (resim/video: ön izleme, yükleme, değiştirme, kaldırma) ----------
async function medyaGoster(id){const k=kayit.find(x=>x.id===id);const kap=document.getElementById('m'+id);if(!k||!kap)return;kap.innerHTML='';
  for(let i=0;i<(k.medya||[]).length;i++){const m=k.medya[i];const b=await kvGet('m:'+id+':'+i);if(!b)continue;const u=URL.createObjectURL(b);
    const el=document.createElement(m.tur==='video'?'video':'img');el.src=u;el.className='th';if(m.tur==='video')el.controls=true;kap.appendChild(el);
    const bt=document.createElement('button');bt.className='b g';bt.textContent='Kaldır: '+m.ad;bt.onclick=async()=>{k.medya.splice(i,1);await kvDel('m:'+id+':'+i);lsSet('kayit',kayit);medyaGoster(id)};kap.appendChild(bt)}}
document.addEventListener('change',async e=>{const id=e.target.dataset&&e.target.dataset.ekle;if(!id)return;const f=e.target.files[0];if(!f)return;
  const k=kayit.find(x=>x.id===id);if(!k)return;const tur=f.type.startsWith('video')?'video':'resim';const ek=(f.name.split('.').pop()||(tur==='video'?'mp4':'jpg')).toLowerCase();
  const kok=(k.sicil&&/^\d+$/.test(k.sicil))?k.sicil:(k.sicil||'sicilsiz').replace(/[^\w.-]/g,'_');
  const n=(k.medya||[]).length;k.medya=k.medya||[];k.medya.push({ad:kok+(n?'_'+(n+1):'')+'.'+ek,tur});await kvSet('m:'+id+':'+(k.medya.length-1),f);lsSet('kayit',kayit);e.target.value='';k.g=0;lsSet('kayit',kayit);medyaGoster(id)});
// ---------- listeler ----------
function listeleriYukle(y,n,b){if(y!=null)yerler=ayr(y);if(n!=null)notlar=ayr(n);
  if(b!=null){bek=ayr(b).map(l=>l.split('\t')).filter(r=>r.length>=3&&r[0]!=='Anahtar');indeksle()}
  listeBilgi();yenile()}
async function kaydetListe(y,n,b){if(y!=null)await kvSet('yerler',y);if(n!=null)await kvSet('notlar',n);if(b!=null)await kvSet('beklenen',b)}
$('dosya').onchange=async e=>{let y=null,n=null,b=null;for(const f of e.target.files){const t=await f.text();const a=f.name.toLowerCase();if(a.includes('yer'))y=t;else if(a.includes('not'))n=t;else if(a.includes('bekle'))b=t}
  await kaydetListe(y,n,b);listeleriYukle(y,n,b);$('gmsg').textContent='Listeler yüklendi.'};
// ---------- Microsoft Graph (isteğe bağlı) ----------
let msal=null,acc=null;
const yol=a=>('/me/drive/root:/'+ayar.kok.split('/').concat(a.split('/')).map(encodeURIComponent).join('/')+':');
async function msalHazir(){if(msal)return true;if(!ayar.cid)return false;
  if(!window.msal){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
  msal=new window.msal.PublicClientApplication({auth:{clientId:ayar.cid,authority:'https://login.microsoftonline.com/organizations',redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
  await msal.initialize();const r=await msal.handleRedirectPromise();acc=(r&&r.account)||msal.getAllAccounts()[0]||null;return true}
async function token(){if(!await msalHazir())throw new Error('Client ID girilmedi (girişsiz mod).');
  if(!acc){await msal.loginRedirect({scopes:['Files.ReadWrite','User.Read']});return null}
  try{return (await msal.acquireTokenSilent({scopes:['Files.ReadWrite','User.Read'],account:acc})).accessToken}
  catch(e){await msal.acquireTokenRedirect({scopes:['Files.ReadWrite','User.Read']});return null}}
async function graph(m,u,body,tip){const t=await token();if(!t)return null;const r=await fetch('https://graph.microsoft.com/v1.0'+u,{method:m,headers:Object.assign({Authorization:'Bearer '+t},tip?{'Content-Type':tip}:{}),body});
  if(!r.ok)throw new Error('Graph '+r.status);return r}
function dosyaMetni(liste){return '#SAYIM1\n'+liste.map(k=>[k.yer,k.sicil,k.ad,k.not,k.t.slice(0,10),k.t.slice(11)].map(s=>String(s||'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n')+'\n'}
async function gonder(sess){const b=kayit.filter(k=>!k.g);if(!b.length){if(!sess)$('gmsg').textContent='Gönderilecek kayıt yok.';return}
  try{const ad=(ayar.cihaz||'telefon').replace(/[^\w-]/g,'_')+'_'+zaman().replace(/[- :]/g,'')+'.txt';
    const r=await graph('PUT',yol('Gelen/'+ad)+'/content',new Blob([dosyaMetni(b)],{type:'text/plain;charset=utf-8'}),'text/plain');if(!r)return;
    for(const k of b){for(let i=0;i<(k.medya||[]).length;i++){const f=await kvGet('m:'+k.id+':'+i);if(f)await graph('PUT',yol('Medya/'+k.medya[i].ad)+'/content',f,f.type||'application/octet-stream')}k.g=1}
    lsSet('kayit',kayit);liste();$('gmsg').textContent=b.length+' kayıt OneDrive\'a gönderildi ('+ad+'). Excel kitabı açıkken 2 dk içinde alır.'}
  catch(e){if(!sess)$('gmsg').textContent='Gönderilemedi: '+e.message+' – kayıtlar telefonda duruyor.'}}
function otoGonder(){if(ayar.cid&&navigator.onLine&&acc)gonder(true)}
$('gonder').onclick=()=>gonder(false);
$('paylas').onclick=async()=>{const b=kayit.filter(k=>!k.g);if(!b.length){$('gmsg').textContent='Gönderilecek kayıt yok.';return}
  const ad=(ayar.cihaz||'telefon').replace(/[^\w-]/g,'_')+'_'+zaman().replace(/[- :]/g,'')+'.txt';
  const f=new File([dosyaMetni(b)],ad,{type:'text/plain'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sayım kayıtları'})}else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=ad;a.click()}
    if(confirm('Dosyayı kaydettiniz/gönderdiniz mi? Evet derseniz bu kayıtlar "gönderildi" işaretlenir.')){b.forEach(k=>k.g=1);lsSet('kayit',kayit);liste()}
    $('gmsg').textContent='Dosyayı OneDrive\\Sayım İşlemleri\\Mobil\\Gelen klasörüne koyun (Excel\'de Ayarlar > Mobil Kayıtları Al).'}catch(e){$('gmsg').textContent='İptal edildi.'}};
$('cek').onclick=async()=>{try{let y,n,b;for(const [a,s] of [['yerler.txt',v=>y=v],['notlar.txt',v=>n=v],['beklenen.txt',v=>b=v]]){const r=await graph('GET',yol(a)+'/content');if(!r)return;s(await r.text())}
  await kaydetListe(y,n,b);listeleriYukle(y,n,b);$('gmsg').textContent='Listeler OneDrive\'dan alındı.'}catch(e){$('gmsg').textContent='Alınamadı: '+e.message+' (Excel\'de Ayarlar > Mobil Listeleri Yaz çalıştırıldı mı?)'}};
// ---------- ayarlar ----------
$('ru').textContent=location.origin+location.pathname;
$('kaydet').onclick=()=>{ayar={cihaz:$('cihaz').value.trim()||'telefon',cid:$('cid').value.trim(),kok:$('kok').value.trim().replace(/^\/|\/$/g,'')||'Sayım İşlemleri/Mobil'};lsSet('ayar',ayar);msal=null;$('amsg').textContent='Kaydedildi.'};
$('giris').onclick=async()=>{try{if(!ayar.cid){$('amsg').textContent='Önce Client ID girip kaydedin.';return}await token();$('amsg').textContent=acc?'Giriş yapıldı: '+acc.username:''}catch(e){$('amsg').textContent='Hata: '+e.message}};
$('sil').onclick=()=>{if(confirm('Gönderilmiş kayıtlar telefondan silinsin mi? (Gönderilmemişler kalır)')){kayit=kayit.filter(k=>!k.g);lsSet('kayit',kayit);liste()}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.s).classList.add('on');if(b.dataset.s==='s-say')$('sicil').focus()});
window.addEventListener('online',otoGonder);
// ---------- başlangıç ----------
(async()=>{$('cihaz').value=ayar.cihaz;$('cid').value=ayar.cid;$('kok').value=ayar.kok;$('yer').value=ls('yer','');
  const y=await kvGet('yerler'),n=await kvGet('notlar'),b=await kvGet('beklenen');listeleriYukle(y!=null?y:null,n!=null?n:null,b!=null?b:null);
  try{if(ayar.cid&&await msalHazir())$('amsg').textContent=acc?'Giriş: '+acc.username:'Giriş yapılmadı'}catch(e){}
  $('durum').textContent=ayar.cid?'OneDrive':'girişsiz';
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  $('sicil').focus()})();
</script></body></html>
